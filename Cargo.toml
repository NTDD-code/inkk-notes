[package]
name = "inkk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
rfd = "0.15"
arboard = "3.4"
image = { version = "0.25", features = ["default-formats"] }
resvg = "0.44"
tiny-skia = "0.11"
pdf-writer = "0.15"
thiserror = "1.0"
